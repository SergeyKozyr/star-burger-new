name: star-burger

services:
  backend:
    build: ./backend
    command: sh -c "python manage.py collectstatic --no-input && python manage.py runserver 0.0.0.0:8080"
    env_file: ./backend/.env
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/opt/app
      - media:/opt/app/media
      - static:/opt/app/staticfiles
    depends_on:
      migrations:
        condition: service_completed_successfully
      frontend:
        condition: service_completed_successfully

  db:
    image: postgres:17
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: ./backend
    command: python manage.py migrate --no-input
    env_file: ./backend/.env
    restart: no
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: no
    volumes:
      - static:/opt/app/staticfiles


volumes:
  postgres-data:
  media:
  static:
